<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contacto</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="shared-header"></div>

    <main class="container">
      <h2>Contacto</h2>
      <p>Formulario de contacto (estatico):</p>
      <form class="form-contact" action="#" method="post">
        <label>Nombre
          <input class="controls" type="text" name="nombre" placeholder="Nombre">
        </label>
        <label>Correo
          <input class="controls" type="email" name="email" placeholder="correo@ejemplo.com">
        </label>
        <label>Mensaje
          <textarea class="controls" name="mensaje" placeholder="Escribe tu mensaje aqui"></textarea>
        </label>
        <input class="buttons" type="submit" value="Enviar">
      </form>
    </main>

    <div id="shared-footer"></div>
    <script src="layout.js"></script>
  </body>
</html>
