<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contacto</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="logo">Mi Proyecto</h1>
        <nav class="main-nav">
          <a href="index.html">Inicio</a>
          <a href="register.html">Registro</a>
          <a href="acerca.html">Acerca</a>
          <a href="servicios.html">Servicios</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2>Contacto</h2>
      <p>Formulario de contacto (estático):</p>
      <form class="form-contact" action="#" method="post">
        <label>Nombre
          <input class="controls" type="text" name="nombre" placeholder="Nombre">
        </label>
        <label>Correo
          <input class="controls" type="email" name="email" placeholder="correo@ejemplo.com">
        </label>
        <label>Mensaje
          <textarea class="controls" name="mensaje" placeholder="Escribe tu mensaje aquí"></textarea>
        </label>
        <input class="buttons" type="submit" value="Enviar">
      </form>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>© 2026 Mi Proyecto — Hecho para la tarea</p>
      </div>
    </footer>
  </body>
</html>
