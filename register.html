<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="logo">Mi Proyecto</h1>
        <nav class="main-nav">
          <a href="index.html">Inicio</a>
          <a href="register.html">Registro</a>
          <a href="acerca.html">Acerca</a>
          <a href="servicios.html">Servicios</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <h2>Formulario de registro</h2>
      <p>Rellena los campos para crear una cuenta.</p>

      <form class="form-register" action="#" method="post">
        <label>Nombre completo
          <input class="controls" type="text" name="nombre" placeholder="Nombre completo">
        </label>

        <label>Correo electrónico
          <input class="controls" type="email" name="email" placeholder="correo@ejemplo.com">
        </label>

        <label>Usuario
          <input class="controls" type="text" name="usuario" placeholder="Usuario">
        </label>

        <label>Contraseña
          <input class="controls" type="password" name="contrasena" placeholder="Contraseña">
        </label>

        <label>Confirmar contraseña
          <input class="controls" type="password" name="contrasena2" placeholder="Confirmar contraseña">
        </label>

        <input class="buttons" type="submit" value="Registrarse">
      </form>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>Hecho para la tarea</p>
      </div>
    </footer>
    <script src="auth.js"></script>
  </body>
</html>
