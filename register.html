<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registro</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="shared-header"></div>

    <main class="container">
      <h2>Formulario de registro</h2>
      <p>Rellena los campos para crear una cuenta.</p>

      <form class="form-register" action="#" method="post">
        <label>Nombre completo
          <input class="controls" type="text" name="nombre" placeholder="Nombre completo">
        </label>

        <label>Correo electronico
          <input class="controls" type="email" name="email" placeholder="correo@ejemplo.com">
        </label>

        <label>Usuario
          <input class="controls" type="text" name="usuario" placeholder="Usuario">
        </label>

        <label>Contrasena
          <input class="controls" type="password" name="contrasena" placeholder="Contrasena">
        </label>

        <label>Confirmar contrasena
          <input class="controls" type="password" name="contrasena2" placeholder="Confirmar contrasena">
        </label>

        <input class="buttons" type="submit" value="Registrarse">
      </form>
    </main>

    <div id="shared-footer"></div>
    <script src="layout.js"></script>
    <script src="auth.js"></script>
  </body>
</html>
